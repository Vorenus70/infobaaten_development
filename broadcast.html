<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>InfoBåten – Send varsel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0b5e7e, #1b8cae);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #0b5e7e;
            font-size: 24px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .subtitle {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e0e5eb;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #0b5e7e;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .title-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cde4f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #0b5e7e;
            box-shadow: 0 0 0 2px rgba(11,94,126,0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .emoji-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .emoji-btn {
            background: #f1f3f4;
            border: none;
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .emoji-btn:hover {
            background: #e8eaed;
            transform: scale(1.05);
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #5f6368;
            margin: 12px 0 8px 0;
        }
        
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #0b5e7e, #1b8cae);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
        }
        
        button[type="submit"]:hover {
            transform: scale(1.01);
            opacity: 0.95;
        }
        
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            display: none;
        }
        
        .status.success {
            background: #e6f4ea;
            color: #0d652d;
            display: block;
        }
        
        .status.error {
            background: #fce8e6;
            color: #c5221f;
            display: block;
        }
        
        .info {
            margin-top: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            font-size: 12px;
            color: #5f6368;
            text-align: center;
        }
        
        .access-denied {
            text-align: center;
            padding: 50px 20px;
            background: white;
            border-radius: 24px;
            max-width: 400px;
            margin: 50px auto;
        }
        
        .access-denied h1 {
            color: #c5221f;
            margin-bottom: 16px;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        // ========== PASSWORD PROTECTION ==========
        const PASSWORD = 'infobaten2026';  // ← Change this to your password!
        
        function checkPassword() {
            const userPassword = prompt('🔒 Skriv inn passord for å sende varsel:');
            return userPassword === PASSWORD;
        }
        
        if (!checkPassword()) {
            document.getElementById('app').innerHTML = `
                <div class="access-denied">
                    <h1>🔒 Ingen tilgang</h1>
                    <p>Du har ikke tilgang til denne siden.</p>
                    <p style="margin-top: 20px; font-size: 12px; color: #5f6368;">Kun administratorer har tilgang.</p>
                </div>
            `;
            throw new Error('Unauthorized access');
        }
        
        // If password is correct, load the app
        const API_URL = 'https://infobaaten-notifications.onrender.com/broadcast';
        
        function addEmoji(targetField, emoji) {
            const field = document.getElementById(targetField);
            const cursorPos = field.selectionStart;
            const textBefore = field.value.substring(0, cursorPos);
            const textAfter = field.value.substring(cursorPos);
            field.value = textBefore + emoji + ' ' + textAfter;
            field.focus();
            field.selectionStart = cursorPos + emoji.length + 1;
            field.selectionEnd = field.selectionStart;
        }
        
        async function sendNotification(title, message) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    title: title,
                    message: message
                })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'Kunne ikke sende varsel');
            }
            
            return await response.json();
        }
        
        function showStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = isError ? 'status error' : 'status success';
            
            setTimeout(() => {
                statusDiv.className = 'status';
            }, 5000);
        }
        
        // Render the app HTML
        document.getElementById('app').innerHTML = `
            <div class="container">
                <h1>
                    <span>📢</span> Send varsel
                </h1>
                <div class="subtitle">
                    Send push-varsel til alle som har abonnert på InfoBåten
                </div>
                
                <form id="notificationForm">
                    <div class="form-group">
                        <label>📌 Tittel (med emoji)</label>
                        <div class="title-input-wrapper">
                            <input type="text" id="title" placeholder="F.eks. 🚤 InfoBåten" value="🚤 InfoBåten">
                        </div>
                        <div class="section-title">➕ Legg til emoji i tittel:</div>
                        <div class="emoji-buttons" id="titleEmojis">
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="🚤">🚤</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="📢">📢</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="⚠️">⚠️</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="✅">✅</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="❌">❌</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="✨">✨</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="🔔">🔔</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="🌊">🌊</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="💧">💧</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="⏰">⏰</button>
                            <button type="button" class="emoji-btn" data-target="title" data-emoji="🎉">🎉</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>💬 Melding (med emoji)</label>
                        <textarea id="message" placeholder="Skriv meldingen her..."></textarea>
                        <div class="section-title">➕ Legg til emoji i melding:</div>
                        <div class="emoji-buttons" id="messageEmojis">
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="📢">📢</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="🚤">🚤</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="📊">📊</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="🌊">🌊</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="💧">💧</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="⚠️">⚠️</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="✅">✅</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="❌">❌</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="✨">✨</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="🔔">🔔</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="⏰">⏰</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="🎉">🎉</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="❤️">❤️</button>
                            <button type="button" class="emoji-btn" data-target="message" data-emoji="👍">👍</button>
                        </div>
                    </div>
                    
                    <button type="submit">📨 Send varsel</button>
                </form>
                
                <div id="status" class="status"></div>
                
                <div class="info">
                    ⚡ Varselet sendes til alle som har aktivert push-varsler i InfoBåten-appen.<br>
                    📱 Test på din egen telefon først!<br>
                    💡 Emojis fungerer i både tittel og melding.
                </div>
            </div>
        `;
        
        // Attach event listeners to emoji buttons
        document.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.getAttribute('data-target');
                const emoji = btn.getAttribute('data-emoji');
                addEmoji(target, emoji);
            });
        });
        
        // Attach form submit handler
        document.getElementById('notificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const message = document.getElementById('message').value.trim();
            
            if (!message) {
                showStatus('❌ Vennligst skriv en melding', true);
                return;
            }
            
            if (!title) {
                showStatus('❌ Vennligst skriv en tittel', true);
                return;
            }
            
            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '📨 Sender...';
            
            try {
                const result = await sendNotification(title, message);
                showStatus(`✅ Varsel sendt til ${result.sent} abonnenter!`);
            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ Feil: ${error.message}`, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📨 Send varsel';
            }
        });
    </script>
</body>
</html>
